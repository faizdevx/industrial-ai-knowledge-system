[project]
name = "industrial-ai-knowledge-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "faizdevx", email = "faisalariflko@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "docling[easyocr]>=2.130.0",
    "fastapi>=0.141.1",
    "neo4j>=6.3.1",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pymupdf>=1.28.2",
    "sentence-transformers>=6.1.0",
    "trl[peft]>=1.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
industrial-ai-knowledge-system = "industrial_ai_knowledge_system:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
